<header class="site-header">
  <div class="container">
    <div class="site-header__inner">

      <a href="index.html" class="site-header__logo" aria-label="Home page">
        <svg class="logo-icon" viewBox="0 0 100 60" aria-hidden="true">
          <use href="#logo-circle" class="logo-icon__circle"></use>
          <use href="#logo-text" class="logo-icon__text"></use>
        </svg>
      </a>

      <nav class="nav" aria-label="Navigation">
        <ul class="nav__list">
          <li><a href="#favorite" class="nav__link">Favorite coffee</a></li>
          <li><a href="#about" class="nav__link">About</a></li>
          <li><a href="#mobile" class="nav__link">Mobile app</a></li>
          <li><a href="#contact" class="nav__link">Contact us</a></li>
        </ul>
      </nav>

      <div class="site-header__actions">
        <button class="theme-toggle" type="button" aria-label="Toggle page theme">
          <span class="theme-toggle__icon theme-toggle__icon--sun">
            <svg class="theme-toggle__svg" width="22" height="22" aria-hidden="true">
              <use href="#sun"></use>
            </svg>
          </span>
          <span class="theme-toggle__icon theme-toggle__icon--moon">
            <svg class="theme-toggle__svg" width="18" height="18" aria-hidden="true">
              <use href="#moon"></use>
            </svg>
          </span>
        </button>

        <a href="catalog.html" class="menu-link">
          Menu
          <svg class="menu-link__icon" width="20" height="20" aria-hidden="true">
            <use href="#coffee-cup"></use>
          </svg>
        </a>

        <button class="burger" type="button" aria-label="Open menu" aria-expanded="false">
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </div>
</header>
