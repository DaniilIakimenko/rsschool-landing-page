<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;1,400;1,600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/normalize.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
</head>

<body>
  <div id="sprite-placeholder"></div>

  <div id="header-placeholder"></div>

  <main>
    <section class="catalog" id="catalog">
      <div class="container">
        <h1 class="catalog__title">
          Behind each of our cups hides an <span class="catalog__title-accent">amazing surprise</span>
        </h1>

        <div class="catalog__tabs">
          <button class="catalog__tab catalog__tab--active" type="button" data-category="coffee">
            <span class="catalog__tab-icon">☕</span>
            <span>Coffee</span>
          </button>

          <button class="catalog__tab" type="button" data-category="tea">
            <span class="catalog__tab-icon">🫖</span>
            <span>Tea</span>
          </button>

          <button class="catalog__tab" type="button" data-category="dessert">
            <span class="catalog__tab-icon">🍰</span>
            <span>Dessert</span>
          </button>
        </div>

        <div class="catalog__grid"></div>

        <button class="catalog__load-more" type="button" aria-label="Show more">
          <svg width="24" height="24" aria-hidden="true">
            <use href="#load-more"></use>
          </svg>
        </button>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script src="js/main.js"></script>
  <script src="js/catalog.js"></script>
</body>

</html>
